<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Resume Analyzer</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }
        .form-control {
            background-color: rgba(15, 23, 42, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #fff !important;
        }
        .form-control:focus {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25) !important;
        }
        .input-group-text {
            background-color: rgba(15, 23, 42, 0.8) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #94a3b8 !important;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                
                <div class="card glass-card shadow-lg p-4">
                    <div class="card-body">
                        
                        <!-- Header -->
                        <div class="text-center mb-4">
                            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3 shadow" style="width: 50px; height: 50px;">
                                <i class="fas fa-sign-in-alt fa-lg"></i>
                            </div>
                            <h3 class="fw-bold text-white mb-1">Welcome Back</h3>
                            <p class="text-muted small">Sign in to your AI Resume account</p>
                        </div>

                        <!-- Flash Messages -->
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ category }} alert-dismissible fade show rounded-3 small py-2 px-3 mb-3" role="alert">
                                        {{ message }}
                                        <button type="button" class="btn-close btn-close-white shadow-none" data-bs-dismiss="alert" aria-label="Close"></button>
                                    </div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <!-- Login Form -->
                        <form action="{{ url_for('login') }}" method="POST">
                            
                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label small text-light fw-medium">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text border-end-0"><i class="fas fa-envelope"></i></span>
                                    <input type="email" class="form-control border-start-0 shadow-none" id="email" name="email" placeholder="name@example.com" required>
                                </div>
                            </div>

                            <!-- Password -->
                            <div class="mb-4">
                                <label for="password" class="form-label small text-light fw-medium">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text border-end-0"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control border-start-0 shadow-none" id="password" name="password" placeholder="••••••••" required>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary btn-lg rounded-3 fw-bold fs-6">
                                    Sign In <i class="fas fa-arrow-right ms-2"></i>
                                </button>
                            </div>

                            <!-- Redirect Link -->
                            <div class="text-center">
                                <p class="text-muted small mb-0">
                                    Don't have an account? 
                                    <a href="{{ url_for('register') }}" class="text-primary text-decoration-none fw-semibold">Create Account</a>
                                </p>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
