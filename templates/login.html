{% extends "base.html" %}

{% block title %}
Login | Resume AI
{% endblock %}


{% block body %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="form-card">

                <h2 class="fw-bold">
                    Welcome Back
                </h2>

                <p class="text-muted">
                    Login to continue.
                </p>


                <form method="POST">

                    <div class="mb-3">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required>

                    </div>


                    <div class="mb-4">

                        <label>
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required>

                    </div>


                    <button
                        class="btn btn-dark w-100">

                        Login

                    </button>

                </form>


                <p class="text-center mt-4">

                    Don't have an account?

                    <a href="{{ url_for('register') }}">
                        Register
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
